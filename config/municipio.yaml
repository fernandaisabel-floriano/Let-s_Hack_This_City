# Configuração por município. Mudar de município = mudar este ficheiro.
# Todos os caminhos são relativos à raiz do repositório.
municipio: aveiro

# Nome da zona (rua piloto). Saída em <saida>/<municipio>/<zona>/<fonte>/
zona: santos-martires
nome_zona: Santos Mártires   # nome mostrado na app. Outras zonas: config/zonas/<id>.yaml (pipeline/nova_zona.py)
saida: data/clean

# Zona piloto v3 ("bairro"): Rua dos Santos Mártires (181 m) + rotunda da ponta
# sul + Cais dos Santos Mártires (119 m), junto à Fábrica Centro Ciência Viva.
# Geometria OSM (ODbL) em config/ruas/santos-martires-v3.geojson (propriedade "via").
# bbox = extensão das três vias + 30 m de margem. [oeste, sul, este, norte] WGS84
# v2 (só a rua), para referência: bbox [-8.658917, 40.637622, -8.656677, 40.639154],
#   config/ruas/santos-martires.geojson e santos-martires-zona.geojson
bbox: [-8.65901, 40.637523, -8.656677, 40.639757]
rua_geojson: config/ruas/santos-martires-v3.geojson
buffer_rua_m: 30          # recolha: imagens com a câmara a ≤ X m de qualquer via

# Zona piloto (pipeline/zona.py)
zona_piloto:
  dist_max_m: 10            # "imagem da zona": câmara a ≤ X m de uma via...
  heading_tol_graus: 35     # ...e heading alinhado com a via mais próxima (± X°, qualquer sentido)
  buffer_avaliacao_m: 15    # M10 e catálogo final: só elementos dentro das vias + X m
  pontas: planas            # planas = a zona acaba onde as vias acabam; redondas = buffer clássico
  pontas_redondas:          # exceções: ponta redonda (raio = buffer) neste extremo
    - {via: Rua dos Santos Mártires, extremo: nordeste}   # inclui o ecoponto OSM a 11,5 m do fim da rua
  rotunda_raio_m: 25        # rotundas: também entra a câmara a ≤ X m do centro...
  rotunda_tol_graus: 45     # ...a olhar para ele (± X°). null desliga (só alinhamento)
zona_avaliacao_geojson: config/ruas/santos-martires-v3-zona.geojson
crs_local: EPSG:3763      # PT-TM06, para buffers em metros e exportação x/y

# Só imagens capturadas a partir desta data (AAAA-MM-DD). null = sem limite.
# 2023+ dava 0 imagens na rua (v2); 2019+ dava 54 a ≤30 m da rua.
desde: "2019-01-01"

incluir_panoramicas: true
panoramicas:
  fov_deg: 90
  vistas: [0, 90, 180, 270]   # somadas ao heading da panorâmica
  tamanho_px: 1024            # lado de cada vista
  usar_original: true         # equiretangular em resolução original (2048 px dá vistas de 512 px)

mapillary:
  tile_graus: 0.002     # lado dos quadrados em que a bbox é dividida
  limit: 2000           # não baixar: com limits pequenos a API trunca ao acaso
  workers_download: 8

# Desfoque antes de gravar (M2). Modelos locais, descarregados para models/.
desfoque:
  margem: 0.25                # alargamento da caixa antes de desfocar
  rostos:      {confianca: 0.6, altura_max: 0.25}   # rosto > 25% da altura = falso positivo
  matriculas:                 # filtro de forma contra falsos positivos em fachadas
    {confianca: 0.25, imgsz: 1280, aspeto_min: 1.2, largura_max: 0.25, altura_max: 0.12}
  cabecas_pessoas: {ativo: true, confianca: 0.15, imgsz: 1280, fracao_altura: 0.25}

# Vídeo próprio (P1.1): pipeline/ingest_video.py
video:
  passo_m: 2.0                # 1 frame a cada X m percorridos
  janela_nitidez_m: 1.0       # etapa 1: em cada marca, o frame mais nítido do metro seguinte (0 = o primeiro)
  fov_lado_maior_deg: 68      # FOV do lado maior do sensor (vale na horizontal e na vertical)
  nitidez_min: 60             # variância do Laplaciano abaixo disto → frame tremido
  velocidade_max_ms: 8        # GPS: salto entre pontos acima disto → "GPS a saltar"
  heading_offset_deg: 0       # 0 = câmara a apontar para a frente; 90 = lado direito
  janela_heading_m: 10        # heading = direção do movimento entre ±X/2 m (trajeto suavizado)
  suavizar_gps_s: 6           # média móvel do GPS (±X/2 s) antes de calcular distância e heading
  velocidade_min_ms: 0.5      # abaixo disto o GPS conta como parado (ruído)
  max_px: 2048                # redimensiona o lado maior
  autor: equipa

# M8 — entrada direta no catálogo (pipeline/confianca.py)
# confianca_elemento = P(real) calibrada por classe (Platt) sobre a média das
# top_k confianças das vistas do elemento fundido (M6). Recalibra com as
# validações do técnico (P1.3).
m8:
  top_k: 3
  min_vistas: 2
  limiar_auto: 0.9
  calibracao: config/calibracao.json
  min_rotulos_por_lado: 10   # classe com menos reais OU falsos do que isto: tudo para a fila

# M3 — deteção com YOLO-World (pipeline/detect.py). prompt: limiar mínimo.
m3:
  modelo: models/yolov8s-worldv2.pt
  imgsz: 1280
  nms_iou: 0.5              # caixas do mesmo grupo sobrepostas → fica a de maior confiança
  prompts:
    sinal: {"traffic sign": 0.05, "stop sign": 0.05, "road sign": 0.05}
    candeeiro: {"street lamp": 0.10}
    contentor: {"underground waste bin": 0.05, "trash can": 0.10}

# M4 — classificação de sinais em cascata (pipeline/classify_signs.py).
# Prioridade à precisão: o incerto vai para a fila como outro_sinal ou
# limite_desconhecido. Limiares iniciais por afinar com pipeline/m4_medir.py.
m4:
  variante: p5              # atual | p1 | p3 | p4 | p5 (m4_medir.py compara todas)
  prompt_stop: stop sign    # p5: deteção vinda deste prompt da M3 = indício forte de STOP
  cedencia_segunda_min: 0.3 # p5: outro_sinal com cedência em 2.º no CLIP (P ≥ X) → fila (18/11: +2 na fila, 0 erros)
  limiar: 0.25              # só "atual": confiança da classe abaixo disto → outro_sinal
  recorte_margem: 0.04      # recorte quadrado e justo para classificar (3–5 %)
  limiar_familia:           # P(família) do CLIP abaixo disto → incerto
    # 0,45 escolhido a 18/11 contra 194 rótulos: 0 erros, fila 50 (0,4: 0 erros, fila 48; 0,5: fila 59)
    {stop: 0.45, cedencia_passagem: 0.45, limite: 0.45, outro_sinal: 0.45, costas: 0.45}
  limiar_numero: 0.6        # p1/p3: P(valor | limite) do CLIP abaixo disto → limite_desconhecido
  lado_min_numero_px: 30    # p4: sinal mais pequeno do que isto → limite_desconhecido
  forma: {}                 # filtro A (m4_forma.py DEFAULTS): limiares HSV e de forma
  algarismos:               # p4 (m4_algarismos.py): templates em config/m4/algarismos/
    aceites: [30, 40, 50]
    score_min: 0.55
    margem_min: 0.08
  voto_lado_max_px: 100     # fusão: peso do voto cresce com o lado do recorte até X px
  voto_min_fracao: 0.6      # fusão: família/valor com menos do que X do voto → incerto
  rotular_lado_min_px: 30   # m4_rotular.py: só recortes com lado maior ≥ X px
  rotulos: reports/m4/rotulos.json
  rotulos_contentores: reports/m4/rotulos_contentores.json   # modo contentores da página
  contentores_versao: v4_video   # teste de prompts cujos contentores a página mostra (--versao=...)
  relatorios: reports/m4    # página de rotulagem, medição, exemplos de erros
  exemplos_por_erro: 3      # m4_medir.py: recortes copiados por tipo de erro frequente
  erros_frequentes: 5       # ...para os N erros mais frequentes do passo final

# Teste de prompts do YOLO-World (test_yolo_world_prompts.py): raw_detections, labels.json
relatorios_yolo_world: reports/yolo_world_test
# Contentores: medição das deteções da M3 contra os rótulos (contentores_medir.py)
contentores_relatorios: reports/contentores

# Contentores — filtro CLIP e tipo (pipeline/contentores_clip.py). Passo opcional do pipeline.
# Medido a 18/11 contra 258 rótulos (reports/contentores/filtro_clip.md); limiar 0,05 confirmado a 18/11.
# Nenhum contentor entra direto (confirmado). Valores medidos:
#   descartar p_contentor < 0,05 → fila 258 → 175, precisão 0,20 → 0,27, perde 3 dos 51 verdadeiros
#   (validação cruzada: recall 0,93, precisão 0,28); "entra direto" ≥ 0,8 dá precisão 0,93 em validação cruzada.
contentores_clip:
  ativo: true               # 18/11, decidido: ligado. Anota clip_contentor/clip_classe/clip_tipo em deteccoes.json
  limiar: 0.05              # 18/11, decidido: deitar fora deteções com p_contentor < 0,05 (null = só anotar)
  escrever_tipo: false      # 18/11, decidido: o tipo não vai para o catálogo por agora (acerta só 6 de 12)
  recorte: justo            # justo (AUC 0,86) | largo (0,81)
  margem_justo: 0.10

# Etapa 1 — qualidade das vistas (pipeline/qualidade.py). As fracas ficam de lado (não entram
# no agrupamento nem na escolha da imagem), não se apagam. Medido a 19/11 (reports/qualidade/medicao.md):
# o tamanho é o que separa — contentores < 43 px: tira 54 % dos falsos, perde 5 % dos verdadeiros.
# Nitidez, brilho e contraste quase não separam: ficam só para os casos extremos.
qualidade:
  ativo: true
  lado_min_px: {sinal: 30, candeeiro: 30, contentor: 42}   # candeeiros sem rótulos: o mesmo dos sinais
  nitidez_min: 100          # variância do Laplaciano (tremido). 19/11: acima de 100 só põe de lado mais reais (150: 9 % das vistas reais, os falsos quase não sobem)
  brilho_min: 15            # quase preto (noite)
  brilho_max: 245           # queimado
  contraste_min: 0

# M5 — coordenadas de cada deteção (pipeline/geolocate.py)
m5:
  sinal_tamanho_m: 0.7      # lado da placa assumido
  camera_altura_m:          # candeeiros/contentores: ponto de contacto com o chão
    default: 2.5
    mapillary: 1.4          # imagens Mapillary da zona são de dashcam (tablier de carro)
    video_proprio: 1.4      # vídeos de 17/11 filmados a pé, telemóvel na mão (2,5 m = viatura)
  dist_min_m: 2
  dist_max_m: 40

# M5+M6 — juntar por direção (raios) e calcular o ponto (pipeline/fuse.py)
m6:
  raio_fusao_m: {sinal: 8, candeeiro: 8, contentor: 8}   # vistas únicas (por classe)
  angulo_min_graus: 10      # triangulação: ângulo mínimo entre raios
  min_raios: 3              # ponto triangulado: ≥ X raios; com 2, só se bater com a distância estimada...
  tol_dist_estimada: 0.35   # ...a ± 35 %
  base_min_m: 2             # distância mínima entre câmaras de um par...
  base_video_min_m: 8       # ...e entre frames do mesmo vídeo
  tol_m: 1.0                # raio passa no ponto se a distância ≤ max(tol_m, tol_frac × alcance)
  tol_frac: 0.05
  modo_por_fonte: {mapillary: carro, video_proprio: pe}
  lado_m: 2.0               # a pé/bicicleta: paralela ao trajeto, do lado do objeto
  margem_lancil_m: 0.5      # de carro: lancil = meia largura da via + margem
  largura_via_m: 3.0        # por faixa, quando a via OSM tem lanes=*
  largura_por_highway: {primary: 10, secondary: 8, tertiary: 7, residential: 6, unclassified: 6, living_street: 5, service: 4, pedestrian: 4}
  edificios_geojson: config/ruas/santos-martires-v3-edificios.geojson
  calibrar_video: true      # δ heading e τ tempo por vídeo, contra o Mapillary
  # etapa 2: juntar dois elementos quando as direções de todas as fotos se cruzam num só ponto
  # (19/11: duplicados juntados 13 → 18 de 29, sem juntar nenhum par que o técnico manteve separado)
  fundir_dist_m: 8          # 0 = desligado
  fundir_tol_m: 2.0         # resíduo mediano máximo dos raios no ponto comum, em cada um dos dois
  fundir_sobreposicao_x: 0.7   # na mesma foto, as caixas têm de apontar na mesma direção
  calib_min_elementos: 5    # elementos partilhados com o Mapillary para estimar δ
  calib_tau_min_elementos: 10   # ...e para estimar também τ (senão τ = 0)

# M9 — exportação (pipeline/export.py)
m9:
  so_dentro_da_zona: true   # catálogo só com elementos dentro do polígono de avaliação

# M10 — avaliação contra a contagem manual (referencia.csv; pipeline/referencia.py)
m10:
  contagem: data/clean/aveiro/santos-martires/contagem.json     # contagem manual por tipo → recall
  referencia: data/clean/aveiro/santos-martires/referencia.csv  # opcional: pontos → erro de posição
  dist_max_m: 8             # encontrado = mesma classe a ≤ X m (um a um), dentro do polígono, sem papeleiras
